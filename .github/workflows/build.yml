name: Compilar Juego a EXE

on:
  workflow_dispatch:
    inputs:
      game_folder:
        description: 'Nombre de la carpeta del juego (dentro de apps/)'
        required: true
        default: 'moncloa'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: ./apps/${{ inputs.game_folder }}
        run: npm install --legacy-peer-deps

      - name: Compilar ejecutable .EXE
        working-directory: ./apps/${{ inputs.game_folder }}
        run: npm run electron:build

      - name: Subir archivo EXE
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game_folder }}-EXE
          path: apps/${{ inputs.game_folder }}/release/*.exe
